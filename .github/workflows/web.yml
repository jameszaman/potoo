name: Web

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "apps/web/**"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "apps/web/**"

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Test
        run: pnpm test --if-present

      - name: Build
        run: pnpm build

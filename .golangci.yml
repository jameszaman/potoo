version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - bodyclose
    - noctx
    - sqlclosecheck
    - exhaustive
    - gocritic
    - gosec

linters-settings:
  goimports:
    local-prefixes: github.com/notifylayer/notifylayer
  revive:
    rules:
      - name: exported
      - name: var-naming
      - name: error-return
      - name: error-strings
      - name: blank-imports
  exhaustive:
    default-signifies-exhaustive: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - revive
        - errcheck

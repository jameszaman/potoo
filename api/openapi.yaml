openapi: "3.0.3"

info:
  title: Potoo API
  version: "0.1.0"
  description: |
    Developer-first notification orchestration platform.

    Authenticate all requests with an API key in the `Authorization` header:

    ```
    Authorization: Bearer <api_key>
    ```

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: system
    description: Health and diagnostics
  - name: notifications
    description: Send and inspect notifications
  - name: deliveries
    description: Delivery records and event timelines
  - name: templates
    description: Template management and rendering
  - name: providers
    description: Provider connection management
  - name: webhooks
    description: Inbound provider webhook endpoints (no auth required)
  - name: auth
    description: User registration and session management
  - name: setup
    description: One-time platform bootstrap

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: API key issued from the Potoo dashboard.

  schemas:
    AuthUser:
      type: object
      required: [id, email, created_at]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time

    OrgSummary:
      type: object
      required: [id, name, slug, type, role, is_active]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        type:
          type: string
          enum: [platform, customer]
        role:
          type: string
          enum: [owner, member]
        is_active:
          type: boolean
        api_key_count:
          type: integer
          description: Number of active (non-revoked) API keys — included in platform org listing
        call_count:
          type: integer
          description: Total notifications sent — included in platform org listing

    UpdateOrgRequest:
      type: object
      properties:
        is_active:
          type: boolean

    SetupRequest:
      type: object
      required: [org_name, first_name, last_name, email, password]
      properties:
        org_name:
          type: string
          description: Platform organization name
          example: Acme Platform
        org_website:
          type: string
          example: https://acme.com
        org_description:
          type: string
          maxLength: 200
          example: The platform organization
        first_name:
          type: string
          example: James
        last_name:
          type: string
          example: Zaman
        phone:
          type: string
          example: "+447911123456"
        email:
          type: string
          format: email
          example: admin@example.com
        password:
          type: string
          minLength: 8

    SelectOrgRequest:
      type: object
      required: [org_id]
      properties:
        org_id:
          type: string

    CreateOrgRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          example: Acme Corp
        slug:
          type: string
          example: acme-corp

    ApiKey:
      type: object
      required: [id, name, key_prefix, scopes, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        key_prefix:
          type: string
          description: First characters of the key — safe to display, not secret
        scopes:
          type: array
          items:
            type: string
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    CreateAPIKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Production key
        scopes:
          type: array
          items:
            type: string
          default: []

    CreateAPIKeyResponse:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: Full API key — shown once, never retrievable again

    RegisterRequest:
      type: object
      required: [org_name, first_name, last_name, email, password]
      properties:
        org_name:
          type: string
          example: Skyline Labs
        org_website:
          type: string
          example: https://example.com
        org_description:
          type: string
          maxLength: 200
          example: A short description of what your organization does
        first_name:
          type: string
          example: Morgan
        last_name:
          type: string
          example: Taylor
        phone:
          type: string
          example: "+1 555 000 0000"
        email:
          type: string
          format: email
          example: you@example.com
        password:
          type: string
          minLength: 8

    InviteAcceptRequest:
      type: object
      required: [token, first_name, last_name, email, password]
      properties:
        token:
          type: string
        first_name:
          type: string
          example: James
        last_name:
          type: string
          example: Zaman
        phone:
          type: string
          example: "+447911123456"
        email:
          type: string
          format: email
          example: james@example.com
        password:
          type: string
          minLength: 8

    CreateInviteRequest:
      type: object
      required: [org_id]
      properties:
        org_id:
          type: string

    InviteResponse:
      type: object
      required: [id, org_id, token, expires_at, created_at]
      properties:
        id:
          type: string
        org_id:
          type: string
        org_name:
          type: string
        token:
          type: string
        used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    InvitePreview:
      type: object
      required: [org_name, expires_at]
      properties:
        org_name:
          type: string
        expires_at:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              example: validation_failed
            message:
              type: string
              example: "Template is missing required variable: first_name"
            request_id:
              type: string
              example: req_01HX1234
            docs_url:
              type: string
              example: https://docs.potoo.com/errors/validation_failed

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          example: ok

    Recipient:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        external_id:
          type: string
          example: user_123
        phone:
          type: string
          example: "+15551234567"

    TemplateRef:
      type: object
      required: [key]
      properties:
        key:
          type: string
          example: welcome_email
        data:
          type: object
          additionalProperties: true
          example:
            first_name: James
            workspace_name: Acme

    RoutingOptions:
      type: object
      properties:
        provider:
          type: string
          example: resend

    SendNotificationRequest:
      type: object
      required: [channel, recipient, template]
      properties:
        channel:
          type: string
          enum: [email, sms, push, whatsapp]
          example: email
        recipient:
          $ref: "#/components/schemas/Recipient"
        template:
          $ref: "#/components/schemas/TemplateRef"
        routing:
          $ref: "#/components/schemas/RoutingOptions"
        idempotency_key:
          type: string
          description: Client-supplied deduplication key. Prefer using the Idempotency-Key header instead.
          example: signup-welcome-user_123
        metadata:
          type: object
          additionalProperties:
            type: string
          example:
            source: signup_flow

    SendNotificationResponse:
      type: object
      required: [notification_id, delivery_id, status]
      properties:
        notification_id:
          type: string
          example: not_01HX1234
        delivery_id:
          type: string
          example: del_01HX1234
        status:
          type: string
          enum: [queued]
          example: queued

    NotificationStatus:
      type: string
      enum: [queued, processing, sent, delivered, failed_temporary, failed_permanent, bounced, complained, suppressed, cancelled]

    Notification:
      type: object
      required: [id, channel, status, created_at]
      properties:
        id:
          type: string
          example: not_01HX1234
        channel:
          type: string
          example: email
        template_key:
          type: string
          example: welcome_email
        recipient_ref:
          type: string
          example: user_123
        status:
          $ref: "#/components/schemas/NotificationStatus"
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Delivery:
      type: object
      required: [id, notification_id, channel, status, attempt_count, created_at]
      properties:
        id:
          type: string
          example: del_01HX1234
        notification_id:
          type: string
          example: not_01HX1234
        channel:
          type: string
          example: email
        provider_type:
          type: string
          example: resend
        provider_message_id:
          type: string
          example: msg_abc123
        status:
          $ref: "#/components/schemas/NotificationStatus"
        attempt_count:
          type: integer
          example: 1
        last_error_code:
          type: string
        last_error_message:
          type: string
        sent_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time
        failed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProviderType:
      type: string
      enum: [resend, sendgrid, ses, twilio, fcm]

    ProviderConnection:
      type: object
      required: [id, provider_type, channel, display_name, is_default, is_active, created_at]
      properties:
        id:
          type: string
          example: pc_01HX1234
        provider_type:
          $ref: "#/components/schemas/ProviderType"
        channel:
          type: string
          enum: [email, sms, push]
          example: email
        display_name:
          type: string
          example: Resend Production
        is_default:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    CreateProviderConnectionRequest:
      type: object
      required: [provider_type, channel, display_name, credentials]
      properties:
        provider_type:
          $ref: "#/components/schemas/ProviderType"
        channel:
          type: string
          enum: [email, sms, push]
        display_name:
          type: string
          example: Resend Production
        credentials:
          type: object
          additionalProperties:
            type: string
          description: Provider-specific credentials. For Resend and SendGrid, provide `api_key`.
          example:
            api_key: re_123abc
        is_default:
          type: boolean
          default: false

    TemplateChannel:
      type: string
      enum: [email, sms, push, whatsapp]

    TemplateVersionStatus:
      type: string
      enum: [draft, active, archived]

    Template:
      type: object
      required: [id, key, name, channel, created_at]
      properties:
        id:
          type: string
          example: tpl_01HX1234
        key:
          type: string
          example: welcome_email
        name:
          type: string
          example: Welcome Email
        channel:
          $ref: "#/components/schemas/TemplateChannel"
        active_version:
          type: integer
          example: 2
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TemplateVersion:
      type: object
      required: [id, template_id, version_number, status, created_at]
      properties:
        id:
          type: string
          example: tv_01HX1234
        template_id:
          type: string
          example: tpl_01HX1234
        version_number:
          type: integer
          example: 1
        subject:
          type: string
          example: "Welcome to {{workspace_name}}"
        html_body:
          type: string
          example: "<p>Hi {{first_name}}</p>"
        text_body:
          type: string
        sms_body:
          type: string
        variables_schema:
          type: object
          additionalProperties:
            type: string
          example:
            first_name: string
            workspace_name: string
        status:
          $ref: "#/components/schemas/TemplateVersionStatus"
        created_at:
          type: string
          format: date-time

    CreateTemplateRequest:
      type: object
      required: [key, name, channel]
      properties:
        key:
          type: string
          example: welcome_email
        name:
          type: string
          example: Welcome Email
        channel:
          $ref: "#/components/schemas/TemplateChannel"

    CreateTemplateVersionRequest:
      type: object
      required: [subject, html_body]
      properties:
        subject:
          type: string
          example: "Welcome to {{workspace_name}}"
        html_body:
          type: string
          example: "<p>Hi {{first_name}}, welcome to {{workspace_name}}!</p>"
        text_body:
          type: string
        sms_body:
          type: string
        variables_schema:
          type: object
          additionalProperties:
            type: string

    RenderTemplateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true
          example:
            first_name: James
            workspace_name: Acme

    RenderTemplateResponse:
      type: object
      required: [subject, html_body]
      properties:
        subject:
          type: string
        html_body:
          type: string
        text_body:
          type: string
        sms_body:
          type: string

    DeliveryEvent:
      type: object
      required: [id, delivery_id, event_type, occurred_at, created_at]
      properties:
        id:
          type: string
          example: evt_01HX1234
        delivery_id:
          type: string
          example: del_01HX1234
        event_type:
          type: string
          enum: [queued, sent, delivered, opened, clicked, bounced, complained, failed]
          example: delivered
        provider_type:
          type: string
          example: resend
        provider_event_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

security:
  - ApiKeyAuth: []

paths:
  /v1/auth/register:
    post:
      operationId: register
      summary: Create a customer organization and owner account together
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Organization and account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Validation error or platform not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email or org slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/accept-invite:
    post:
      operationId: acceptInvite
      summary: Accept an invite and create a user account
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteAcceptRequest"
      responses:
        "201":
          description: Account created and joined organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Invite already used or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/invite/{token}:
    get:
      operationId: getInvite
      summary: Validate an invite token and return org info for the invite page
      tags: [auth]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Valid invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        "404":
          description: Invite not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Invite already used or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/login:
    post:
      operationId: login
      summary: Sign in and receive a session cookie
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated — sets HttpOnly session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Exchange a refresh token for a new access + refresh token pair
      tags: [auth]
      security: []
      responses:
        "200":
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/logout:
    post:
      operationId: logout
      summary: Sign out and clear the session cookie
      tags: [auth]
      security: []
      responses:
        "204":
          description: Logged out

  /v1/auth/me:
    get:
      operationId: getMe
      summary: Get the current authenticated user
      tags: [auth]
      security: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/platform/status:
    get:
      operationId: getPlatformStatus
      summary: Returns whether the platform has been configured
      tags: [setup]
      security: []
      responses:
        "200":
          description: Platform status
          content:
            application/json:
              schema:
                type: object
                required: [is_configured]
                properties:
                  is_configured:
                    type: boolean

  /v1/setup:
    post:
      operationId: setup
      summary: One-time platform bootstrap — creates platform org and first owner
      tags: [setup]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Platform bootstrapped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Platform already configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/select-org:
    post:
      operationId: selectOrg
      summary: Switch active org — deletes current session and starts a new one
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectOrgRequest"
      responses:
        "200":
          description: Org selected — new session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not a member of the requested org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/me/orgs:
    get:
      operationId: listMyOrgs
      summary: List all orgs the current user belongs to
      tags: [auth]
      security: []
      responses:
        "200":
          description: Org list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrgSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/platform/orgs:
    get:
      operationId: listOrgs
      summary: List all customer organizations (platform owner only)
      tags: [platform]
      responses:
        "200":
          description: Org list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrgSummary"
    post:
      operationId: createOrg
      summary: Create a customer organization (platform owner only)
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgRequest"
      responses:
        "201":
          description: Org created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgSummary"
        "409":
          description: Slug already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/platform/orgs/{orgId}:
    patch:
      operationId: updateOrg
      summary: Update a customer organization (platform owner only)
      tags: [platform]
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgRequest"
      responses:
        "200":
          description: Org updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgSummary"
        "404":
          description: Org not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/platform/invites:
    post:
      operationId: createInvite
      summary: Create a single-use invite link for a customer org (platform owner only)
      tags: [platform]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"
        "404":
          description: Org not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listInvites
      summary: List all invites (platform owner only)
      tags: [platform]
      security: []
      responses:
        "200":
          description: Invite list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/InviteResponse"

  /v1/api-keys:
    get:
      operationId: listAPIKeys
      summary: List API keys for the session org
      tags: [api-keys]
      security: []
      responses:
        "200":
          description: Key list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKey"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createAPIKey
      summary: Create an API key
      tags: [api-keys]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyRequest"
      responses:
        "201":
          description: Key created — full key shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAPIKeyResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:

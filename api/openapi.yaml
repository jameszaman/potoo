openapi: "3.0.3"

info:
  title: NotifyLayer API
  version: "0.1.0"
  description: |
    Developer-first notification orchestration platform.

    Authenticate all requests with an API key in the `Authorization` header:

    ```
    Authorization: Bearer <api_key>
    ```

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: system
    description: Health and diagnostics
  - name: notifications
    description: Send and inspect notifications
  - name: deliveries
    description: Delivery records and event timelines

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: API key issued from the NotifyLayer dashboard.

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              example: validation_failed
            message:
              type: string
              example: "Template is missing required variable: first_name"
            request_id:
              type: string
              example: req_01HX1234
            docs_url:
              type: string
              example: https://docs.notifylayer.com/errors/validation_failed

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          example: ok

    Recipient:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        external_id:
          type: string
          example: user_123
        phone:
          type: string
          example: "+15551234567"

    TemplateRef:
      type: object
      required: [key]
      properties:
        key:
          type: string
          example: welcome_email
        data:
          type: object
          additionalProperties: true
          example:
            first_name: James
            workspace_name: Acme

    RoutingOptions:
      type: object
      properties:
        provider:
          type: string
          example: resend

    SendNotificationRequest:
      type: object
      required: [channel, recipient, template]
      properties:
        channel:
          type: string
          enum: [email, sms, push, whatsapp]
          example: email
        recipient:
          $ref: "#/components/schemas/Recipient"
        template:
          $ref: "#/components/schemas/TemplateRef"
        routing:
          $ref: "#/components/schemas/RoutingOptions"
        idempotency_key:
          type: string
          description: Client-supplied deduplication key. Prefer using the Idempotency-Key header instead.
          example: signup-welcome-user_123
        metadata:
          type: object
          additionalProperties:
            type: string
          example:
            source: signup_flow

    SendNotificationResponse:
      type: object
      required: [notification_id, delivery_id, status]
      properties:
        notification_id:
          type: string
          example: not_01HX1234
        delivery_id:
          type: string
          example: del_01HX1234
        status:
          type: string
          enum: [queued]
          example: queued

    NotificationStatus:
      type: string
      enum: [queued, processing, sent, delivered, failed_temporary, failed_permanent, bounced, complained, suppressed, cancelled]

    Notification:
      type: object
      required: [id, channel, status, created_at]
      properties:
        id:
          type: string
          example: not_01HX1234
        channel:
          type: string
          example: email
        template_key:
          type: string
          example: welcome_email
        recipient_ref:
          type: string
          example: user_123
        status:
          $ref: "#/components/schemas/NotificationStatus"
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Delivery:
      type: object
      required: [id, notification_id, channel, status, attempt_count, created_at]
      properties:
        id:
          type: string
          example: del_01HX1234
        notification_id:
          type: string
          example: not_01HX1234
        channel:
          type: string
          example: email
        provider_type:
          type: string
          example: resend
        provider_message_id:
          type: string
          example: msg_abc123
        status:
          $ref: "#/components/schemas/NotificationStatus"
        attempt_count:
          type: integer
          example: 1
        last_error_code:
          type: string
        last_error_message:
          type: string
        sent_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time
        failed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DeliveryEvent:
      type: object
      required: [id, delivery_id, event_type, occurred_at, created_at]
      properties:
        id:
          type: string
          example: evt_01HX1234
        delivery_id:
          type: string
          example: del_01HX1234
        event_type:
          type: string
          enum: [queued, sent, delivered, opened, clicked, bounced, complained, failed]
          example: delivered
        provider_type:
          type: string
          example: resend
        provider_event_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

security:
  - ApiKeyAuth: []

paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Health check
      description: Returns 200 when the API is running. No authentication required.
      tags: [system]
      security: []
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/notifications:
    post:
      operationId: sendNotification
      summary: Send a notification
      description: Enqueues a notification for delivery. Returns immediately with a queued status.
      tags: [notifications]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Client-supplied deduplication key. Requests with the same key return the original response.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendNotificationRequest"
      responses:
        "202":
          description: Notification queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendNotificationResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Idempotency key conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/notifications/{notification_id}:
    get:
      operationId: getNotification
      summary: Get a notification
      description: Returns a notification record by ID.
      tags: [notifications]
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
          example: not_01HX1234
      responses:
        "200":
          description: Notification found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/deliveries/{delivery_id}:
    get:
      operationId: getDelivery
      summary: Get a delivery
      description: Returns a delivery record by ID.
      tags: [deliveries]
      parameters:
        - name: delivery_id
          in: path
          required: true
          schema:
            type: string
          example: del_01HX1234
      responses:
        "200":
          description: Delivery found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "401":
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Delivery not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/deliveries/{delivery_id}/events:
    get:
      operationId: getDeliveryEvents
      summary: Get delivery events
      description: Returns the full event timeline for a delivery.
      tags: [deliveries]
      parameters:
        - name: delivery_id
          in: path
          required: true
          schema:
            type: string
          example: del_01HX1234
      responses:
        "200":
          description: Delivery events
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeliveryEvent"
        "401":
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Delivery not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

ApiKey:
  type: object
  required: [id, name, key_prefix, scopes, created_at]
  properties:
    id:
      type: string
    name:
      type: string
    key_prefix:
      type: string
      description: First characters of the key — safe to display, not secret
    scopes:
      type: array
      items:
        type: string
    last_used_at:
      type: string
      format: date-time
    revoked_at:
      type: string
      format: date-time
    created_at:
      type: string
      format: date-time

CreateAPIKeyRequest:
  type: object
  required: [name]
  properties:
    name:
      type: string
      example: Production key
    scopes:
      type: array
      items:
        type: string
      default: []

CreateAPIKeyResponse:
  allOf:
    - $ref: "#/components/schemas/ApiKey"
    - type: object
      required: [key]
      properties:
        key:
          type: string
          description: Full API key — shown once, never retrievable again
